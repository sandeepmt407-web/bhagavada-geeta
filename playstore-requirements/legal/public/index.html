<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhagavad Gita — Legal</title>
<style>
  :root { --ink:#1d2230; --muted:#5b6478; --accent:#b07220; --rule:#e3e0d8; --bg:#fbf9f5; --panel:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#eae5da; --muted:#a2a9bb; --accent:#e8a33d; --rule:#2b3350; --bg:#0b1026; --panel:#131a35; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:0 16px 72px; background:var(--bg); color:var(--ink);
         font:17px/1.65 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; }
  header { padding:64px 0 10px; border-bottom:2px solid var(--accent); margin-bottom:28px; }
  h1 { font-size:2rem; margin:0 0 6px; letter-spacing:.06em; }
  .sub { color:var(--muted); margin:0; }
  a.card { display:block; text-decoration:none; color:inherit; background:var(--panel);
           border:1px solid var(--rule); border-radius:12px; padding:20px 22px; margin:14px 0; }
  a.card:hover { border-color:var(--accent); }
  a.card strong { display:block; font-size:1.15rem; color:var(--accent); margin-bottom:4px; }
  a.card span { color:var(--muted); font-size:.95rem; }
  footer { margin-top:48px; padding-top:20px; border-top:1px solid var(--rule);
           color:var(--muted); font-size:.9rem; }
  code { background:rgba(127,127,127,.14); padding:1px 5px; border-radius:4px; font-size:.9em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BHAGAVAD GITA</h1>
    <p class="sub">All eighteen chapters and 701 verses, for Android.</p>
  </header>

  <a class="card" href="./privacy.html">
    <strong>Privacy Policy</strong>
    <span>What the app stores, and the one thing that can leave your phone.</span>
  </a>

  <a class="card" href="./terms.html">
    <strong>Terms &amp; Conditions</strong>
    <span>How the app may be used, and where its text comes from.</span>
  </a>

  <footer>
    <code>com.theops.bhagvadgeeta</code><br>
    <a href="mailto:sandeepmt407@gmail.com">sandeepmt407@gmail.com</a>
  </footer>
</div>
</body>
</html>
